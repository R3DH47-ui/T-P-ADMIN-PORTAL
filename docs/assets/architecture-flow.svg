<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">T-P-ADMIN-PORTAL Architecture Flow</title>
  <desc id="arch-desc">End-to-end request and event architecture connecting Admin, Recruiter, and Student clients to Next.js App Router, lib services, Supabase Postgres and Realtime, Cloudinary, and Firebase Cloud Messaging.</desc>

  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1017"/>
      <stop offset="100%" stop-color="#151926"/>
    </linearGradient>
    <pattern id="archGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60A5FA"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FBBF24"/>
    </marker>
    <clipPath id="archClip">
      <rect x="0" y="0" width="1200" height="540" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .flow-blue {
      stroke-dasharray: 8 6;
      animation: dashFlow 2.6s linear infinite;
    }
    .flow-green {
      stroke-dasharray: 7 5;
      animation: dashFlow 3.2s linear infinite;
    }
    .flow-amber {
      stroke-dasharray: 6 6;
      animation: dashFlow 2.8s linear infinite;
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -28; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow-blue, .flow-green, .flow-amber { animation: none !important; }
    }
  </style>

  <g clip-path="url(#archClip)">
    <rect x="0" y="0" width="1200" height="540" rx="18" fill="url(#archBg)"/>
    <rect x="0" y="0" width="1200" height="540" fill="url(#archGrid)"/>

    <!-- Header -->
    <text x="36" y="40" class="sans" font-size="20" font-weight="800" fill="#F8FAFC">Runtime Architecture &amp; Data Flow</text>
    <text x="36" y="60" class="mono" font-size="11.5" fill="#94A3B8">Actors -&gt; Next.js 16 App Router (RBAC) -&gt; Domain Services -&gt; Supabase / Cloudinary / FCM HTTP v1</text>

    <!-- Legend -->
    <g transform="translate(765, 22)">
      <rect x="0" y="0" width="400" height="36" rx="10" fill="#181E2E" stroke="#2D374E" stroke-width="1"/>
      <circle cx="20" cy="18" r="4.5" fill="#60A5FA"/>
      <text x="30" y="22" class="mono" font-size="10.5" fill="#CBD5E1">HTTP / API</text>
      <circle cx="122" cy="18" r="4.5" fill="#34D399"/>
      <text x="132" y="22" class="mono" font-size="10.5" fill="#CBD5E1">Realtime / DB</text>
      <circle cx="246" cy="18" r="4.5" fill="#FBBF24"/>
      <text x="256" y="22" class="mono" font-size="10.5" fill="#CBD5E1">FCM Push / Uploads</text>
    </g>

    <!-- COLUMN 1: ACTORS / CLIENTS -->
    <g transform="translate(34, 92)">
      <rect x="0" y="0" width="222" height="378" rx="14" fill="#131826" stroke="#2B344C" stroke-width="1.2"/>
      <text x="16" y="26" class="mono" font-size="11" font-weight="700" fill="#93C5FD">01 // ACTORS &amp; CLIENTS</text>

      <!-- Admin Actor -->
      <rect x="14" y="42" width="194" height="86" rx="10" fill="#1C2336" stroke="#8B1D2C" stroke-width="1.3"/>
      <text x="26" y="65" class="sans" font-size="13.5" font-weight="700" fill="#FFFFFF">Institutional Admin</text>
      <text x="26" y="84" class="mono" font-size="10.5" fill="#CBD5E1">/admin • Multi-Account</text>
      <text x="26" y="101" class="mono" font-size="10" fill="#94A3B8">Dossiers, Drives, Approvals</text>
      <text x="26" y="116" class="mono" font-size="10" fill="#FFDF9B">Role: ADMIN / SUPER_ADMIN</text>

      <!-- Company Actor -->
      <rect x="14" y="144" width="194" height="86" rx="10" fill="#1C2336" stroke="#3E6FD9" stroke-width="1.3"/>
      <text x="26" y="167" class="sans" font-size="13.5" font-weight="700" fill="#FFFFFF">Corporate Recruiter</text>
      <text x="26" y="186" class="mono" font-size="10.5" fill="#CBD5E1">/company • Google / Email</text>
      <text x="26" y="203" class="mono" font-size="10" fill="#94A3B8">Talent Pool &amp; Stats View</text>
      <text x="26" y="218" class="mono" font-size="10" fill="#93C5FD">Role: COMPANY (Staff Locked)</text>

      <!-- Student Actor -->
      <rect x="14" y="246" width="194" height="114" rx="10" fill="#1C2336" stroke="#1E9E5A" stroke-width="1.3"/>
      <text x="26" y="269" class="sans" font-size="13.5" font-weight="700" fill="#FFFFFF">Student App &amp; Web</text>
      <text x="26" y="288" class="mono" font-size="10.5" fill="#CBD5E1">/register/[slug]</text>
      <text x="26" y="304" class="mono" font-size="10.5" fill="#CBD5E1">/drives/[slug] + Deep Links</text>
      <text x="26" y="321" class="mono" font-size="10" fill="#94A3B8">Expo React Native Companion</text>
      <text x="26" y="340" class="mono" font-size="10" fill="#6EE7B7">Status: APPROVED Gate</text>
    </g>

    <!-- COLUMN 2: NEXT.JS APP ROUTER & MIDDLEWARE -->
    <g transform="translate(310, 92)">
      <rect x="0" y="0" width="246" height="378" rx="14" fill="#131826" stroke="#2B344C" stroke-width="1.2"/>
      <text x="16" y="26" class="mono" font-size="11" font-weight="700" fill="#E7B94A">02 // NEXT.JS 16 APP ROUTER</text>

      <!-- Auth Guard & Middleware -->
      <rect x="14" y="42" width="218" height="94" rx="10" fill="#211824" stroke="#E7B94A" stroke-width="1.2"/>
      <text x="26" y="64" class="sans" font-size="13" font-weight="700" fill="#FFDF9B">Middleware &amp; RBAC Gate</text>
      <text x="26" y="83" class="mono" font-size="10.5" fill="#E2E8F0">withAuth() • getAuthContext()</text>
      <text x="26" y="100" class="mono" font-size="10" fill="#CBD5E1">HMAC-SHA256 JWT Verification</text>
      <text x="26" y="116" class="mono" font-size="10" fill="#FDA4AF">Live Revoke / Reject Lockout</text>

      <!-- App Router Pages -->
      <rect x="14" y="150" width="218" height="96" rx="10" fill="#1C2336" stroke="#334155" stroke-width="1.1"/>
      <text x="26" y="172" class="sans" font-size="13" font-weight="700" fill="#FFFFFF">UI Views &amp; Public Forms</text>
      <text x="26" y="191" class="mono" font-size="10" fill="#94A3B8">9 Views in src/views/*</text>
      <text x="26" y="207" class="mono" font-size="10" fill="#94A3B8">SSR Forms: /register/[slug]</text>
      <text x="26" y="223" class="mono" font-size="10" fill="#94A3B8">Universal/App Links (.well-known)</text>

      <!-- Serverless API Routes -->
      <rect x="14" y="260" width="218" height="100" rx="10" fill="#1C2336" stroke="#3E6FD9" stroke-width="1.1"/>
      <text x="26" y="282" class="sans" font-size="13" font-weight="700" fill="#FFFFFF">App API Routes (/api/*)</text>
      <text x="26" y="300" class="mono" font-size="10" fill="#CBD5E1">/admin/drives • /requests</text>
      <text x="26" y="316" class="mono" font-size="10" fill="#CBD5E1">/admin/internship-opportunities</text>
      <text x="26" y="332" class="mono" font-size="10" fill="#CBD5E1">/register • /fcm/* • /cloudinary</text>
      <text x="26" y="348" class="mono" font-size="10" fill="#CBD5E1">/placement-stats/*</text>
    </g>

    <!-- COLUMN 3: SERVICE / LIB LAYER -->
    <g transform="translate(612, 92)">
      <rect x="0" y="0" width="246" height="378" rx="14" fill="#131826" stroke="#2B344C" stroke-width="1.2"/>
      <text x="16" y="26" class="mono" font-size="11" font-weight="700" fill="#C4B5FD">03 // LIB SERVICE ENGINES</text>

      <rect x="14" y="42" width="218" height="72" rx="10" fill="#1C2336" stroke="#475569" stroke-width="1"/>
      <text x="26" y="64" class="sans" font-size="13" font-weight="700" fill="#FFFFFF">Auth &amp; Validation</text>
      <text x="26" y="82" class="mono" font-size="10" fill="#CBD5E1">auth.js (PBKDF2 10k + JWT)</text>
      <text x="26" y="98" class="mono" font-size="10" fill="#94A3B8">drives/schema.js (Zod v4 lock)</text>

      <rect x="14" y="126" width="218" height="76" rx="10" fill="#1C2336" stroke="#475569" stroke-width="1"/>
      <text x="26" y="148" class="sans" font-size="13" font-weight="700" fill="#FFFFFF">Unified Data Adapter</text>
      <text x="26" y="166" class="mono" font-size="10" fill="#CBD5E1">db.js + driveClient.js</text>
      <text x="26" y="182" class="mono" font-size="10" fill="#94A3B8">Memory-First Cache + PostgREST</text>

      <rect x="14" y="214" width="218" height="72" rx="10" fill="#1C2336" stroke="#475569" stroke-width="1"/>
      <text x="26" y="236" class="sans" font-size="13" font-weight="700" fill="#FFFFFF">Analytics &amp; CSV Export</text>
      <text x="26" y="254" class="mono" font-size="10" fill="#CBD5E1">placementStats.js • driveUtils.js</text>
      <text x="26" y="270" class="mono" font-size="10" fill="#94A3B8">BOM + Formula-Safe CSV Stream</text>

      <rect x="14" y="298" width="218" height="62" rx="10" fill="#1E2433" stroke="#FBBF24" stroke-width="1.2"/>
      <text x="26" y="320" class="sans" font-size="13" font-weight="700" fill="#FDE68A">Notification Dedupe &amp; FCM</text>
      <text x="26" y="338" class="mono" font-size="10" fill="#CBD5E1">createNotification (20s Idempotency)</text>
      <text x="26" y="352" class="mono" font-size="10" fill="#94A3B8">fcmAdmin.js (OAuth2 RS256 -&gt; HTTP v1)</text>
    </g>

    <!-- COLUMN 4: INFRASTRUCTURE & EXTERNAL -->
    <g transform="translate(914, 92)">
      <rect x="0" y="0" width="252" height="378" rx="14" fill="#131826" stroke="#2B344C" stroke-width="1.2"/>
      <text x="16" y="26" class="mono" font-size="11" font-weight="700" fill="#34D399">04 // DATA &amp; CLOUD SERVICES</text>

      <!-- Supabase -->
      <rect x="14" y="42" width="224" height="148" rx="10" fill="#11241E" stroke="#34D399" stroke-width="1.3"/>
      <text x="26" y="65" class="sans" font-size="14" font-weight="700" fill="#6EE7B7">Supabase Platform</text>
      <text x="26" y="85" class="mono" font-size="10.5" fill="#E2E8F0">PostgreSQL (21 Schema Tables)</text>
      <text x="26" y="102" class="mono" font-size="10" fill="#A7F3D0">RLS + RPCs (publish_drive, etc.)</text>
      <text x="26" y="119" class="mono" font-size="10" fill="#A7F3D0">Triggers (Auto-Slug &amp; Notify)</text>
      <text x="26" y="138" class="mono" font-size="10.5" fill="#E2E8F0">Realtime (13+ Tables Stream)</text>
      <text x="26" y="155" class="mono" font-size="10" fill="#A7F3D0">Postgres Changes + Broadcast</text>
      <text x="26" y="174" class="mono" font-size="10" fill="#94A3B8">Auth &amp; Certificate Storage Bucket</text>

      <!-- Cloudinary -->
      <rect x="14" y="204" width="224" height="68" rx="10" fill="#192136" stroke="#60A5FA" stroke-width="1.2"/>
      <text x="26" y="226" class="sans" font-size="13.5" font-weight="700" fill="#93C5FD">Cloudinary Media</text>
      <text x="26" y="244" class="mono" font-size="10" fill="#CBD5E1">SHA-1 Upload Signatures (/sign)</text>
      <text x="26" y="260" class="mono" font-size="10" fill="#94A3B8">Company Logos &amp; Scholar Docs</text>

      <!-- Firebase FCM -->
      <rect x="14" y="286" width="224" height="74" rx="10" fill="#261D12" stroke="#FBBF24" stroke-width="1.3"/>
      <text x="26" y="308" class="sans" font-size="13.5" font-weight="700" fill="#FDE68A">Firebase Cloud Messaging</text>
      <text x="26" y="326" class="mono" font-size="10" fill="#FDE68A">FCM HTTP v1 API (all_students)</text>
      <text x="26" y="343" class="mono" font-size="10" fill="#CBD5E1">Android Channels + Topic Relay</text>
    </g>

    <!-- ANIMATED CONNECTORS & PACKETS -->
    <!-- Actors -> Next.js -->
    <path id="pathA1" d="M 244 176 L 310 176" fill="none" stroke="#60A5FA" stroke-width="2" class="flow-blue" marker-end="url(#arrowBlue)"/>
    <path id="pathA2" d="M 244 280 L 310 280" fill="none" stroke="#60A5FA" stroke-width="2" class="flow-blue" marker-end="url(#arrowBlue)"/>
    <path id="pathA3" d="M 244 385 L 310 385" fill="none" stroke="#34D399" stroke-width="2" class="flow-green" marker-end="url(#arrowGreen)"/>

    <!-- Next.js -> Service Layer -->
    <path id="pathB1" d="M 556 176 L 612 176" fill="none" stroke="#60A5FA" stroke-width="2" class="flow-blue" marker-end="url(#arrowBlue)"/>
    <path id="pathB2" d="M 556 260 L 612 260" fill="none" stroke="#60A5FA" stroke-width="2" class="flow-blue" marker-end="url(#arrowBlue)"/>
    <path id="pathB3" d="M 556 410 L 612 410" fill="none" stroke="#FBBF24" stroke-width="2" class="flow-amber" marker-end="url(#arrowAmber)"/>

    <!-- Service Layer -> Infrastructure -->
    <path id="pathC1" d="M 858 210 L 914 210" fill="none" stroke="#34D399" stroke-width="2" class="flow-green" marker-end="url(#arrowGreen)"/>
    <path id="pathC2" d="M 858 330 L 914 330" fill="none" stroke="#60A5FA" stroke-width="2" class="flow-blue" marker-end="url(#arrowBlue)"/>
    <path id="pathC3" d="M 858 420 L 914 420" fill="none" stroke="#FBBF24" stroke-width="2" class="flow-amber" marker-end="url(#arrowAmber)"/>

    <!-- Realtime & Push Return Loop along outer track & bottom (no text overlap) -->
    <path id="pathReturnRealtime" d="M 1152 210 L 1180 210 L 1180 492 L 158 492 L 158 454" fill="none" stroke="#34D399" stroke-width="2" class="flow-green" marker-end="url(#arrowGreen)"/>
    <path id="pathReturnFcm" d="M 1030 452 L 1030 516 L 108 516 L 108 454" fill="none" stroke="#FBBF24" stroke-width="2" class="flow-amber" marker-end="url(#arrowAmber)"/>

    <!-- Footer labels on bottom tracks -->
    <rect x="330" y="481" width="286" height="20" rx="5" fill="#0D1017" stroke="#1E293B" stroke-width="1"/>
    <text x="473" y="495" text-anchor="middle" class="mono" font-size="10" fill="#6EE7B7">Supabase Realtime Stream (Live Roster &amp; Alerts)</text>

    <rect x="650" y="505" width="286" height="20" rx="5" fill="#0D1017" stroke="#1E293B" stroke-width="1"/>
    <text x="793" y="519" text-anchor="middle" class="mono" font-size="10" fill="#FDE68A">FCM HTTP v1 Push -&gt; Expo Student Devices</text>

    <!-- Moving Data Packets -->
    <circle r="4" fill="#60A5FA">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M 244 176 L 310 176"/>
    </circle>
    <circle r="4" fill="#60A5FA">
      <animateMotion dur="2.6s" begin="0.4s" repeatCount="indefinite" path="M 556 260 L 612 260"/>
    </circle>
    <circle r="4.5" fill="#34D399">
      <animateMotion dur="2.2s" begin="0.8s" repeatCount="indefinite" path="M 858 210 L 914 210"/>
    </circle>
    <circle r="4.5" fill="#FBBF24">
      <animateMotion dur="2.2s" begin="0.3s" repeatCount="indefinite" path="M 858 420 L 914 420"/>
    </circle>
    <circle r="4.5" fill="#34D399">
      <animateMotion dur="5.6s" repeatCount="indefinite" path="M 1152 210 L 1180 210 L 1180 492 L 158 492 L 158 454"/>
    </circle>
    <circle r="4.5" fill="#FBBF24">
      <animateMotion dur="5.8s" begin="1.4s" repeatCount="indefinite" path="M 1030 452 L 1030 516 L 108 516 L 108 454"/>
    </circle>

    <!-- Outer frame -->
    <rect x="1" y="1" width="1198" height="538" rx="17" fill="none" stroke="#283146" stroke-width="1.5"/>
  </g>
</svg>
